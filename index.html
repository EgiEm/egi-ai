<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="EgiAI — Autonomous senior digital partner and Second Brain for Endri 'Egi' Emini. Modular chatbot built with vanilla HTML, CSS, and JavaScript.">
    <title>EgiAI — Second Brain</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Overlay (Mobile) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar Drawer (Left) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-accent">&lt;</span>EgiAI<span class="logo-accent">/&gt;</span>
                </div>
                <button class="btn-close-sidebar" id="close-sidebar-btn" aria-label="Close Sidebar">&times;</button>
            </div>

            <button class="btn btn-primary btn-new-chat" id="new-chat-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                New Chat
            </button>

            <!-- Conversation History List -->
            <div class="history-container">
                <h3 class="history-title">Recent Chats</h3>
                <ul class="chat-list" id="chat-list">
                    <!-- Loaded dynamically via app.js -->
                </ul>
            </div>

            <div class="sidebar-footer">
                <div class="footer-user-container">
                    <div class="footer-user">
                        <div class="avatar">EE</div>
                        <div class="user-info">
                            <span class="username">Egi Emini</span>
                            <span class="user-role">Developer</span>
                        </div>
                    </div>
                    <button class="btn-settings" id="settings-btn" aria-label="Open Settings" style="display: none;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area (Right) -->
        <main class="chat-container">
            <!-- Header bar -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="btn-menu-toggle" id="menu-toggle-btn" aria-label="Open Sidebar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <h2 class="active-chat-title" id="active-chat-title">New Conversation</h2>
                </div>
                <div class="header-right">
                    <span class="status-indicator">Online</span>
                    <div class="indicator-dot"></div>
                </div>
            </header>

            <!-- Messages Window -->
            <div class="messages-window" id="messages-window">
                <!-- Loaded dynamically via app.js -->
            </div>

            <!-- Input area -->
            <footer class="input-container">
                <form class="input-form" id="chat-form">
                    <input type="text" id="chat-input" placeholder="What's the mission, Egi?" required
                        autocomplete="off">
                    <button type="submit" class="btn btn-send" id="send-btn" aria-label="Send Message">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
                <div class="input-footer">
                    EgiAI — Your Second Brain. I don't guess, I execute.
                </div>
            </footer>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-overlay" id="settings-modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>EgiAI Settings</h3>
                <button class="btn-close-modal" id="close-modal-btn" aria-label="Close Settings">&times;</button>
            </div>
            <div class="modal-body">
                <form id="settings-form">
                    <div class="form-group">
                        <label class="form-label">Brain Mode</label>
                        <div class="mode-options">
                            <label class="mode-option">
                                <input type="radio" name="brain-mode" value="simulated" checked>
                                <span class="mode-card">
                                    <span class="mode-icon">🧠</span>
                                    <span class="mode-title">Simulated Brain</span>
                                    <span class="mode-desc">Uses local knowledge base simulation</span>
                                </span>
                            </label>
                            <label class="mode-option">
                                <input type="radio" name="brain-mode" value="gemini">
                                <span class="mode-card">
                                    <span class="mode-icon">⚡</span>
                                    <span class="mode-title">Gemini 2.0 Flash</span>
                                    <span class="mode-desc">Real-time, official Google Gemini AI</span>
                                </span>
                            </label>
                            <label class="mode-option">
                                <input type="radio" name="brain-mode" value="proxy">
                                <span class="mode-card">
                                    <span class="mode-icon">🔮</span>
                                    <span class="mode-title">Free LLM Proxy</span>
                                    <span class="mode-desc">Uses free public keys from GitHub</span>
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="form-group" id="api-key-group" style="display: none;">
                        <label for="gemini-key-input" id="key-label" class="form-label">API Key</label>
                        <input type="password" id="gemini-key-input" placeholder="Paste your API key here..."
                            autocomplete="off">
                        <div class="form-help" id="key-help">
                            Get a free API Key from <a href="https://aistudio.google.com/" target="_blank"
                                rel="noopener noreferrer">Google AI Studio</a>.
                        </div>
                    </div>
                    <div id="proxy-config-group" style="display: none;">
                        <div class="form-group">
                            <label for="proxy-base-url" class="form-label">Proxy Base URL</label>
                            <input type="text" id="proxy-base-url" value="https://aiapiv2.pekpik.com/v1"
                                placeholder="e.g. https://api.openai.com/v1" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="proxy-model" class="form-label">Model ID</label>
                            <input type="text" id="proxy-model" value="openai/gpt-chat-latest"
                                placeholder="e.g. openai/gpt-chat-latest" autocomplete="off">
                            <div class="form-help">
                                E.g., `openai/gpt-chat-latest` or `deepseek/deepseek-v4-flash`
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-save-settings">Save Configurations</button>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js?v=1.0.1"></script>
</body>

</html>
