<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EgiAI — Autonomous senior digital partner and Second Brain for Endri 'Egi' Emini. Modular chatbot built with vanilla HTML, CSS, and JavaScript.">
    <title>EgiAI — Second Brain</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Overlay (Mobile) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar Drawer (Left) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-accent">&lt;</span>EgiAI<span class="logo-accent">/&gt;</span>
                </div>
                <button class="btn-close-sidebar" id="close-sidebar-btn" aria-label="Close Sidebar">&times;</button>
            </div>

            <button class="btn btn-primary btn-new-chat" id="new-chat-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New Chat
            </button>

            <!-- Conversation History List -->
            <div class="history-container">
                <h3 class="history-title">Recent Chats</h3>
                <ul class="chat-list" id="chat-list">
                    <!-- Loaded dynamically via app.js -->
                </ul>
            </div>

            <div class="sidebar-footer">
                <div class="footer-user">
                    <div class="avatar">EE</div>
                    <div class="user-info">
                        <span class="username">Egi Emini</span>
                        <span class="user-role">Developer</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area (Right) -->
        <main class="chat-container">
            <!-- Header bar -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="btn-menu-toggle" id="menu-toggle-btn" aria-label="Open Sidebar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <h2 class="active-chat-title" id="active-chat-title">New Conversation</h2>
                </div>
                <div class="header-right">
                    <span class="status-indicator">Online</span>
                    <div class="indicator-dot"></div>
                </div>
            </header>

            <!-- Messages Window -->
            <div class="messages-window" id="messages-window">
                <!-- Loaded dynamically via app.js -->
            </div>

            <!-- Input area -->
            <footer class="input-container">
                <form class="input-form" id="chat-form">
                    <input type="text" id="chat-input" placeholder="What's the mission, Egi?" required autocomplete="off">
                    <button type="submit" class="btn btn-send" id="send-btn" aria-label="Send Message">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
                <div class="input-footer">
                    EgiAI — Your Second Brain. I don't guess, I execute.
                </div>
            </footer>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
